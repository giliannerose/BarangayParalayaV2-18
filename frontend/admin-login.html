<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Barangay Paralaya</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
font-family:Arial;
}

.login-container{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-card{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
text-align:center;
width:100%;
max-width:400px;
}

.login-card img{
width:80px;
margin-bottom:15px;
}

.login-card h3{
color:#198754;
margin-bottom:20px;
}

.google-btn{
background:#198754;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
font-weight:bold;
width:100%;
}

.google-btn:hover{
background:#146c43;
}

.back-link{
margin-top:15px;
display:block;
font-size:14px;
color:#6c757d;
text-decoration:none;
}

.back-link:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

<img src="img/logo.png" alt="Barangay Logo">

<h3>Admin Login</h3>

<p class="text-muted small mb-4">
Sign in using your authorized Google account
</p>

<a href="/auth/login">
<button class="google-btn">
Login with Google
</button>
</a>

<a href="/" class="back-link">← Back to Homepage</a>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const error = params.get("error");

if (error === "unauthorized") {
  alert("You are not authorized to access the admin panel.");
}

</script>

</body>
</html>
